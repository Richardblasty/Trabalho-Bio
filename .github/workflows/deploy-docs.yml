
name: Deploy Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: documentation-deploy
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare existing HTML site
        run: |
          python scripts/prepare_site.py

      - name: Verify documentation source
        run: |
          test -f .versioned-docs/index.html
          test -f .versioned-docs/style.css
          test -f .versioned-docs/script.js
          test -f .versioned-docs/version-selector.js

      - name: Validate MkDocs build
        run: |
          mkdocs build

      - name: Deploy development version
        if: github.ref == 'refs/heads/main'
        run: |
          mike deploy --push dev

      - name: Deploy release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mike deploy --push --update-aliases --alias-type=copy "$VERSION" latest
          mike set-default --push "$VERSION"

  publish-pages:
    needs: deploy-docs
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
